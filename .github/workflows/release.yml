name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package no longer exists; only platform-tools is needed here.
          packages: "platform-tools"

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAYTIMER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TRAYTIMER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRAYTIMER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRAYTIMER_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/traytimer-release.jks"
          {
            echo "TRAYTIMER_KEYSTORE=$RUNNER_TEMP/traytimer-release.jks"
            echo "TRAYTIMER_STORE_PASSWORD=$STORE_PASSWORD"
            echo "TRAYTIMER_KEY_ALIAS=$KEY_ALIAS"
            echo "TRAYTIMER_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleStandardRelease assembleDevRelease

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp app/build/outputs/apk/standard/release/app-standard-release.apk \
             "release/TrayTimer-${{ steps.version.outputs.version }}-standard.apk"
          cp app/build/outputs/apk/dev/release/app-dev-release.apk \
             "release/TrayTimer-${{ steps.version.outputs.version }}-dev.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: TrayTimer ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build from commit `${{ github.sha }}`.

            **Signed APKs** — enable "install unknown apps" and install manually. Releases use a stable signing key, so future versions update in place.

            - `TrayTimer-${{ steps.version.outputs.version }}-standard.apk` — package `com.traytimer`
            - `TrayTimer-${{ steps.version.outputs.version }}-dev.apk` — package `com.traytimer.dev` (installs alongside)
          files: release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
